name: Atualizar canais
on:
  schedule:
    - cron: '0 9 * * 3'   # toda quarta-feira, 6h da manhã (horário de Brasília)
  workflow_dispatch:
permissions:
  contents: write
concurrency: atualizar-canais
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar canais e gerar listas
        run: node scripts/atualizar-canais.mjs
      - name: Publicar
        run: |
          git config user.name "Aurora TV robô"
          git config user.email "robo@users.noreply.github.com"
          git add lista
          git diff --cached --quiet || git commit -m "Canais atualizados $(date -u +%d/%m/%Y)"
          git push
