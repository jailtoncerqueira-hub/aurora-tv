name: Guia de programação
on:
  schedule:
    - cron: '0 8 * * *'   # todo dia, 5h da manhã (horário de Brasília)
  workflow_dispatch:
permissions:
  contents: write
concurrency: guia
jobs:
  guia:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Escolher canais com guia
        run: node scripts/guia.mjs canais
      - name: Baixar o coletor de programação (iptv-org/epg)
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg
      - name: Coletar programação (2 dias)
        working-directory: epg
        continue-on-error: true
        timeout-minutes: 120
        run: |
          npm install --no-audit --no-fund
          npm run grab --- --channels=../guia/canais.xml --output=../guia/guide.xml --days=2
      - name: Converter para o app
        run: node scripts/guia.mjs converter
      - name: Publicar
        run: |
          git config user.name "Aurora TV robô"
          git config user.email "robo@users.noreply.github.com"
          git add guia/agora.json guia/canais.xml
          git diff --cached --quiet || git commit -m "Guia de programação $(date -u +%d/%m/%Y)"
          git pull --rebase --autostash && git push
